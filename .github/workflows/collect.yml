name: collect

# 每 5 分钟抓一次（GitHub 的 cron 最小粒度；实际会排队，常见延迟 1–10 分钟）
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}      # 手动触发，便于第一次验证

permissions:
  contents: write

concurrency:
  group: btc-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集
        run: python scripts/collect.py --config config.json --out data

      - name: 发布到 data 分支
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "btc-proxy-bot"
          git config user.email "btc-proxy-bot@users.noreply.github.com"

          # 与上一版 data 分支比对，内容没变就不推（同一 5 分钟窗口内的重复触发）
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch -q origin data
            if git diff --quiet FETCH_HEAD -- data; then
              echo "数据无变化，跳过提交"
              exit 0
            fi
          fi

          # data 分支只放数据，且每次用孤儿提交重写：
          # 历史永远只有 1 个 commit，不会因为 288 次/天 的提交而膨胀。
          git checkout --orphan data-tmp
          git rm -r --cached . -q || true
          git add -f data
          git commit -q -m "snapshot $(date -u +%FT%TZ)"
          git branch -D data 2>/dev/null || true
          git branch -m data
          git push -f origin data
